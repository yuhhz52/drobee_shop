spring:
  application:
    name: shopecom

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          prepare_threshold: 0
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
    clean-disabled: false
    connect-retries: 3
    init-sql: "-- Flyway init"
    validate-on-migrate: false

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    tls: ${REDIS_TLS:false}
    ssl:
      enabled: ${REDIS_TLS:false}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

logging:
  level:
    org.springframework.mail: DEBUG

jwt:
  signerKey: ${JWT_SECRET}
  auth:
    expires_in: 3600
  refresh:
    expires_in: 1296000

app:
  oauth2:
    redirect-uri: http://localhost:5175/oauth2/callback
  order-confirmed-url: ${ORDER_CONFIRMED_URL:http://localhost:5175/orderConfirmed}

stripe:
  secret: ${STRIPE_SECRET}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE}
  hashSecret: ${VNPAY_HASH_SECRET}
  payUrl: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  returnUrl: http://host.docker.internal:8080/api/orders/vnpay-return

upload:
  dir: uploads
