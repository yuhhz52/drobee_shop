# =============================================
# Production Profile — thin override only
# Base defaults come from application.yaml
# =============================================
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    # ddl-auto stays 'validate' — never auto-modify schema in prod

  flyway:
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.yuhecom.shopecom: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.mail: WARN
  file:
    name: /var/log/shopecom/application.log
    max-size: 100MB
    max-history: 30
